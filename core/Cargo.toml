[package]
name = "tos-skit-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Lossless PC Tales of Symphonia SKP editing core"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.128", optional = true }

